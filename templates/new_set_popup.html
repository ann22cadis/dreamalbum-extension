<div class="DA-sub-panel" id="DA-style-editor-panel">
    <div class="DA-sub-header">
        <span class="DA-sub-title">
            <i class="fa-solid fa-pen-to-square"></i> Редактор стиля
            <span id="DA-style-editor-dirty" class="DA-editor-dirty" title="Есть несохранённые изменения" hidden></span>
        </span>
        <button class="DA-icon-btn" id="DA-style-editor-close" title="Закрыть"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="DA-sub-content DA-style-editor-content">

        <!-- Превью + Название -->
        <div class="DA-editor-head">
            <div id="DA-style-editor-img-preview" class="DA-editor-cover" title="Обложка стиля">
                <i class="fa-solid fa-image"></i>
            </div>
            <div class="DA-editor-name">
                <input type="file" id="DA-style-editor-img-upload" accept="image/*" style="display:none;">
                <label class="DA-label" for="DA-style-editor-name">Название</label>
                <input id="DA-style-editor-name" class="DA-input" type="text" placeholder="Название стиля..." autocomplete="off" maxlength="80">
                <div id="DA-style-editor-name-error" class="DA-editor-error" hidden></div>
            </div>
        </div>

        <!-- Промпт -->
        <div class="DA-editor-prompt">
            <div class="DA-editor-prompt-head">
                <label class="DA-label" for="DA-style-editor-prompt">Промпт (системная инструкция)</label>
                <!-- Чипы макросов строятся в JS: шаблон проходит через Handlebars, и двойные фигурные скобки он подставил бы сам. -->
                <div class="DA-editor-macros" role="group" aria-label="Вставить макрос в позицию курсора"></div>
            </div>
            <textarea id="DA-style-editor-prompt" class="DA-input DA-editor-textarea" spellcheck="false"
                ></textarea>
            <div class="DA-editor-stats" aria-live="polite">
                <span id="DA-style-editor-stats"></span>
                <span id="DA-style-editor-warn" class="DA-editor-warn" hidden></span>
            </div>
        </div>

        <!-- Кнопка сохранить -->
        <div class="DA-editor-actions">
            <button id="DA-style-editor-save" class="DA-footer-btn DA-btn-primary" title="Ctrl+S">
                <i class="fa-solid fa-floppy-disk"></i> <span>Сохранить стиль</span>
            </button>
        </div>
    </div>
</div>
